<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0f2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ffa06b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:1"/>
